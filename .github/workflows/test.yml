name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 项目零依赖（无 npm install），直接跑语法检查 + 全部测试套件
      - name: 语法检查 + 全部测试
        run: npm test
